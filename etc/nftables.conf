#!/usr/bin/nft -f

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"
    tcp dport ssh accept comment "allow sshd"

    # Allow DHCPv4, useful for faster renewals, though not required to make DHCPv4 work.
    udp sport bootps udp dport bootpc accept

    # Allow mDNS for zeroconf/avahi discovery.
    ip daddr 224.0.0.251 udp dport mdns accept
    ip6 daddr ff02::fb udp dport mdns accept

    # Open ports for NFS/Kerberos
    tcp dport { 88, 749, 2049 } accept
    udp dport { 88, 749 } accept

    # Open port for brscan-skey (Brother scanner)
    udp dport 54925 accept

    # Open port for coolercontrol
    tcp dport 11987 accept
  }

  chain forward {
    type filter hook forward priority filter
    policy drop
  }

  chain output {
    type filter hook output priority filter
    policy accept
  }
}
